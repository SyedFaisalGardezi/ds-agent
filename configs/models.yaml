# Single-model configuration:
#   All tasks use qwen3.8:27b-mlx (Qwen3.5 arch, 27.8B, 262K ctx, tools+vision+thinking)
#
# Override via env vars:
#   DSAGENT_SCOPE_MODEL=<model>
#   DSAGENT_CODE_MODEL=<model>

scope_model: "qwen3.8:27b-mlx"
code_model: "qwen3.8:27b-mlx"

task_model_map:
  understand_task: "qwen3.8:27b-mlx"
  plan: "qwen3.8:27b-mlx"
  route: "qwen3.8:27b-mlx"
  synthesise: "qwen3.8:27b-mlx"
  qa: "qwen3.8:27b-mlx"
  code: "qwen3.8:27b-mlx"    # execute_code generation
  sql: "qwen3.8:27b-mlx"     # SQL generation
  math: "qwen3.8:27b-mlx"    # numeric/math traces
  default: "qwen3.8:27b-mlx"

ollama_pull_commands:
  - "ollama pull qwen3.8:27b-mlx"
