[project]
name = "ds-agent"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  # LLM + orchestration
  "langchain>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langchain-ollama>=0.2,<0.3",
  "chromadb>=0.5,<0.6",
  "sentence-transformers>=3.0,<4.0",

  # Data connectors (light)
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "snowflake-connector-python>=3.0,<4.0",
  "pymongo>=4.0,<5.0",
  "redis>=5.0,<6.0",
  "scipy>=1.13,<2.0",

  # ETL + EDA
  "pandas>=2.2,<3.0",
  "polars>=0.20,<2.0",
  "pyarrow>=16.0,<20.0",
  "pywavelets>=1.6,<2.0",
  "statsmodels>=0.14,<1.0",
  "ydata-profiling>=4.0,<5.0",

  # ML + DL
  "torch>=2.3,<3.0",
  "scikit-learn>=1.5,<2.0",
  "xgboost>=2.0,<3.0",
  "lightgbm>=4.0,<5.0",
  "optuna>=3.6,<5.0",
  "flaml>=2.2,<3.0",

  # Interpretability
  "shap>=0.45,<1.0",
  "lime>=0.2,<1.0",

  # MLflow + DVC
  "mlflow>=2.14,<3.0",
  "dvc>=3.50,<4.0",

  # Deployment
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=4.0,<8.0",
  "onnx>=1.16,<2.0",
  "onnxruntime>=1.18,<2.0",

  # Power BI
  "msal>=1.28,<2.0",
  "requests>=2.31,<3.0",

  # Monitoring
  "prometheus-client>=0.20,<1.0",

  # Reporting
  "python-pptx>=0.6,<2.0",
  "jinja2>=3.1,<4.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<1.0",
  "plotly>=5.22,<7.0",

  # Utils
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
  "rich>=13.0,<15.0",
  "httpx>=0.27,<1.0",
  "tenacity>=8.3,<10.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<8.0",
  "pytest-asyncio>=0.23,<2.0",
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0",
  "hypothesis>=6.0,<7.0",
]

# Opt-in extras (not installed in dev image by default)
timeseries = [
  "prophet>=1.1,<2.0",
  "neuralforecast>=1.7,<3.0",
]
causal = [
  "dowhy>=0.11,<1.0",
  "econml>=0.15,<1.0",
]
streaming = [
  "confluent-kafka>=2.0,<3.0",
]
finetune = [
  "peft>=0.13,<1.0",
  "trl>=0.12,<1.0",
  "bitsandbytes>=0.45,<1.0",
]
bigquery = [
  "google-cloud-bigquery>=3.0,<4.0",
]
azure = [
  "pyodbc>=5.0,<6.0",
]
seismic = [
  "segyio>=1.9,<2.0",
]
catboost = [
  "catboost>=1.2,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
# ML convention allows X, X_train, X_val, y_true, y_pred — suppress pep8 naming
# rules that conflict with linear-algebra notation.
ignore = [
    "N803",  # argument name should be lowercase  (e.g. X, X_train)
    "N806",  # variable in function should be lowercase  (e.g. X, X_val)
    "N812",  # lowercase imported as non-lowercase   (e.g. torch.nn as N)
    "B905",  # zip without strict — too noisy on iterables we know are aligned
    "E501",  # line-too-long — we format to ~100 but accept LaTeX / long strings
    "E741",  # ambiguous variable name (e.g. "l")
    "E702",  # multi-statement on one line (terse guards in ML code)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "E402"]  # tests monkey-patch modules / reload
# agent_tools builds kernel code as triple-quoted f-string templates. Loop vars
# (_c, _cnt, _sv, ...) are defined inside the generated string and bound at
# runtime in the kernel, but Python 3.12+ (PEP 701) makes ruff descend into the
# nested f-string expressions and flag them as undefined. False positives —
# tests exercise these paths. Ignore F821 for this file only.
"agent/api/agent_tools.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
# chromadb's type stubs insist on ndarray[float32] but accept list[list[float]] at
# runtime; sentence-transformers returns Python lists. Silence the false positive.
[[tool.mypy.overrides]]
module = [
    "agent.connectors.registry",
    "agent.core.memory",
    "agent.memory.long_term",
    "agent.memory.schema_cache",
]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
