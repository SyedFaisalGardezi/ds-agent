name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "tests/**"
      - "pyproject.toml"
      - "dvc.lock"

jobs:
  fast-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy agent/ --ignore-missing-imports
      - name: Unit tests
        run: pytest tests/unit/ -x --cov=agent --cov-fail-under=80
      - name: DVC dry run
        run: dvc repro --dry
      - name: Schema validation
        run: python tests/schema_validation.py
