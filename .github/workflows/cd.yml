name: CD

on:
  push:
    branches: [main]

jobs:
  full-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy agent/ --ignore-missing-imports
      - name: Unit tests
        run: pytest tests/unit/ -x --cov=agent --cov-fail-under=80
      - name: DVC dry run
        run: dvc repro --dry
      - name: Integration tests
        run: pytest tests/integration/
      # Build only, to prove the image builds. Nothing is published from CI, so
      # the workflow needs no registry login; see "Publishing the Docker image"
      # in README.md to push an image to your own registry.
      - name: Docker build
        run: docker build --target runtime -t ds-agent:${{ github.sha }} .
      - name: MLflow metric gate
        run: python deploy/mlflow_gate.py
        env:
          CHALLENGER_SHA: ${{ github.sha }}
