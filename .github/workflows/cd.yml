name: CD

on:
  push:
    branches: [main]

jobs:
  full-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy agent/ --ignore-missing-imports
      - name: Unit tests
        run: pytest tests/unit/ -x --cov=agent --cov-fail-under=80
      # A fresh checkout has no stage outputs yet, so run the pipeline before
      # the dry run checks the declared stages (the same order as CI).
      - name: Reproduce demonstration pipeline
        run: dvc repro
      - name: DVC dry run
        run: dvc repro --dry
      - name: Integration tests
        # Coverage is gated on the unit-test step; the integration tests alone
        # cover a small part of the code.
        run: pytest tests/integration/ --no-cov
      # Build only, to prove the sandbox image builds. Nothing is published from
      # CI, so the workflow needs no registry login.
      - name: Docker build
        run: docker build -f docker/sandbox.Dockerfile -t ds-agent-sandbox:${{ github.sha }} .
      - name: MLflow metric gate
        run: python deploy/mlflow_gate.py
        env:
          CHALLENGER_SHA: ${{ github.sha }}
